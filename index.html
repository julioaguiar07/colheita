<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110E0C">
<title>Ranking da Colheita</title>
<meta name="description" content="Quem mais colheu castanha: ranking do dia, da semana e do mês.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M38 8c13 2 20 16 15 30-4 12-17 20-29 16-9-3-12-12-8-19 3-6 10-7 13-12 3-6 1-15 9-15z' fill='%23C9A27A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=2">
<link rel="stylesheet" href="ranking.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="topo">
    <div class="marca">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M38 8c13 2 20 16 15 30-4 12-17 20-29 16-9-3-12-12-8-19 3-6 10-7 13-12 3-6 1-15 9-15z" fill="#C9A27A"/><path d="M40 14c7 3 10 12 7 21" stroke="#E7CFA8" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/></svg>
      <div><small id="fazenda">Fazenda</small><b>Ranking da colheita</b></div>
    </div>
    <div class="acoes">
      <button class="btn icone" id="btnBusca" aria-label="Buscar uma pessoa" title="Buscar uma pessoa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
  </header>

  <div id="demo"></div>

  <nav class="seg" id="modos" aria-label="Período">
    <button data-modo="dia" aria-pressed="true">Dia</button>
    <button data-modo="7" aria-pressed="false">7 dias</button>
    <button data-modo="30" aria-pressed="false">30 dias</button>
    <button data-modo="mes" aria-pressed="false">Mês</button>
  </nav>

  <div class="quando">
    <button class="btn icone" id="ant" aria-label="Período anterior">‹</button>
    <label class="quando-centro">
      <span id="quandoTxt" class="quando-txt">—</span>
      <span class="quando-dica">toque para escolher a data</span>
      <input type="date" id="pickDia" class="pick" aria-label="Escolher dia">
      <input type="month" id="pickMes" class="pick" aria-label="Escolher mês" hidden>
    </label>
    <button class="btn icone" id="prox" aria-label="Próximo período">›</button>
  </div>

  <main class="grade">
    <section class="col-a">
      <div class="resumo" id="resumo"></div>
      <div class="podio" id="podio" aria-label="Pódio"></div>
      <ol class="lista" id="lista" aria-label="Classificação"></ol>
    </section>
    <section class="col-b">
      <div class="card">
        <div class="card-cab"><div><h2>Quem colheu mais</h2><div class="sub" id="subBarras">Quilos de castanha no período</div></div></div>
        <div id="gBarras" class="g"></div>
      </div>
      <div class="card" id="cardLinha">
        <div class="card-cab"><div><h2>Dia a dia dos 5 primeiros</h2><div class="sub">Quilos por dia, para ver quem está subindo</div></div></div>
        <div id="gLinha" class="g" style="height:280px"></div>
      </div>
      <div class="card" id="cardFazenda">
        <div class="card-cab"><div><h2>Colheita da fazenda</h2><div class="sub">Total de todos, por dia</div></div></div>
        <div id="gFazenda" class="g" style="height:220px"></div>
      </div>
    </section>
  </main>
  <p class="rodape dim">Atualiza sozinho a cada minuto · <span id="atualizado"></span></p>
</div>

<div class="sheet-fundo" id="fundo" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitulo" hidden></div>

<script type="module" src="ranking.js?v=2"></script>
</body>
</html>
