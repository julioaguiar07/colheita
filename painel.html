<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110E0C">
<meta name="robots" content="noindex">
<title>Painel da Colheita</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M38 8c13 2 20 16 15 30-4 12-17 20-29 16-9-3-12-12-8-19 3-6 10-7 13-12 3-6 1-15 9-15z' fill='%23FF6A3D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=2">
<link rel="stylesheet" href="painel.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js" defer></script>
</head>
<body>
<div class="wrap" id="app">
  <header class="topo">
    <div class="marca">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M38 8c13 2 20 16 15 30-4 12-17 20-29 16-9-3-12-12-8-19 3-6 10-7 13-12 3-6 1-15 9-15z" fill="#FF6A3D"/><path d="M40 14c7 3 10 12 7 21" stroke="#FFC2A6" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/></svg>
      <div><small id="fazenda">Fazenda</small><b>Painel da colheita</b></div>
    </div>
    <div class="acoes">
      <button class="btn" id="btnLink" title="Copiar o link do ranking para enviar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        <span class="so-largo">Link do ranking</span>
      </button>
      <button class="btn icone" id="btnSair" aria-label="Sair" title="Sair">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>
      </button>
    </div>
  </header>
  <div id="demo"></div>
  <nav class="seg abas" id="abas" aria-label="Seções">
    <button data-aba="lancar" aria-pressed="true">Lançar pesagens</button>
    <button data-aba="pessoas" aria-pressed="false">Pessoas</button>
    <button data-aba="analise" aria-pressed="false">Análise</button>
  </nav>
  <main id="conteudo"></main>
</div>

<div class="login" id="login" hidden>
  <form class="card login-card" id="formLogin">
    <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><path d="M38 8c13 2 20 16 15 30-4 12-17 20-29 16-9-3-12-12-8-19 3-6 10-7 13-12 3-6 1-15 9-15z" fill="#FF6A3D"/></svg>
    <h1>Painel da colheita</h1>
    <p class="muted">Entre para lançar as pesagens.</p>
    <label>E-mail<input class="campo" type="email" name="email" autocomplete="username" required></label>
    <label>Senha<input class="campo" type="password" name="senha" autocomplete="current-password" required></label>
    <button class="btn primario" type="submit">Entrar</button>
    <p class="erro-login" id="erroLogin" role="alert"></p>
  </form>
</div>

<div class="sheet-fundo" id="fundo" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<script type="module" src="painel.js?v=2"></script>
</body>
</html>
